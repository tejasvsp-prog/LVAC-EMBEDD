/* =========================================================
   LVAC AI Summit — Civic Editorial Theme
   ========================================================= */

:root {
  /* palette */
  --ink:          #0B2545;
  --ink-2:        #13335a;
  --ink-3:        #1d4373;
  --paper:        #EEF4ED;
  --paper-warm:   #F6F2E8;
  --paper-card:   #FFFDF8;
  --slate:        #8DA9C4;
  --slate-deep:   #4A6B8A;
  --red:          #D62828;
  --red-dim:      #B81F1F;
  --gold:         #C9A24A;

  /* derived */
  --line:         rgba(11, 37, 69, 0.12);
  --line-mid:     rgba(11, 37, 69, 0.22);
  --line-strong:  rgba(11, 37, 69, 0.55);
  --ink-soft:     rgba(11, 37, 69, 0.62);
  --ink-faint:    rgba(11, 37, 69, 0.42);

  /* type */
  --serif: "Source Serif 4", "Source Serif Pro", Georgia, serif;
  --sans:  "Geist", "Söhne", -apple-system, "Helvetica Neue", sans-serif;
  --mono:  "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;

  /* layout */
  --gutter: clamp(20px, 4vw, 56px);
  --maxw: 1280px;
  --rule: 1px solid var(--line);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "cv11";
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { display: block; max-width: 100%; }

::selection { background: var(--ink); color: var(--paper); }

/* ---------- Typography ---------- */
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 500;
}
.eyebrow .dot {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--red);
  border-radius: 50%;
  margin-right: 10px;
  vertical-align: middle;
  transform: translateY(-1px);
}

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; margin: 0; letter-spacing: -0.01em; line-height: 1.05; }
h1 { font-size: clamp(48px, 7.6vw, 124px); letter-spacing: -0.025em; }
h2 { font-size: clamp(36px, 4.6vw, 72px); }
h3 { font-size: clamp(22px, 2vw, 30px); line-height: 1.15; }
h4 { font-size: 18px; line-height: 1.2; }
.it { font-style: italic; font-weight: 400; }

p { margin: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 14px 22px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.02em;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  border-radius: 0;
  transition: transform .2s ease, background .2s ease, color .2s ease;
  position: relative;
  overflow: hidden;
}
.btn .arrow { transition: transform .25s ease; }
.btn:hover .arrow { transform: translateX(4px); }
.btn:hover { background: var(--red); border-color: var(--red); }
.btn--ghost {
  background: transparent;
  color: var(--ink);
}
.btn--ghost:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn--lg { padding: 18px 28px; font-size: 15px; }

/* ---------- Layout primitives ---------- */
.container {
  max-width: var(--maxw);
  margin: 0 auto;
  padding-left: var(--gutter);
  padding-right: var(--gutter);
}

section { position: relative; }
.section { padding: clamp(72px, 9vw, 140px) 0; }
.section--dense { padding: clamp(56px, 7vw, 100px) 0; }

.rule { border-top: var(--rule); }
.rule-strong { border-top: 1px solid var(--line-strong); }

.sec-head {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 48px;
  padding-bottom: 56px;
  border-bottom: var(--rule);
  margin-bottom: 56px;
}
.sec-head__label { padding-top: 8px; }
.sec-head__body { max-width: 760px; }
.sec-head__body h2 { margin-bottom: 20px; }
.sec-head__body p { font-size: 17px; color: var(--ink-soft); max-width: 620px; }
@media (max-width: 800px) {
  .sec-head { grid-template-columns: 1fr; gap: 20px; padding-bottom: 32px; margin-bottom: 40px; }
}

/* ---------- Reveal on scroll ---------- */
.reveal {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1);
}
.reveal.is-in { opacity: 1; transform: none; }
.reveal--stagger > * {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1);
}
.reveal--stagger.is-in > * { opacity: 1; transform: none; }
.reveal--stagger.is-in > *:nth-child(1) { transition-delay: .05s; }
.reveal--stagger.is-in > *:nth-child(2) { transition-delay: .15s; }
.reveal--stagger.is-in > *:nth-child(3) { transition-delay: .25s; }
.reveal--stagger.is-in > *:nth-child(4) { transition-delay: .35s; }
.reveal--stagger.is-in > *:nth-child(5) { transition-delay: .45s; }
.reveal--stagger.is-in > *:nth-child(6) { transition-delay: .55s; }

/* =========================================================
   Nav
   ========================================================= */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(238, 244, 237, 0.82);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid transparent;
  transition: border-color .25s ease, background .25s ease;
}
.nav.is-scrolled {
  border-bottom-color: var(--line);
  background: rgba(238, 244, 237, 0.94);
}
.nav__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--serif);
  font-size: 19px;
  letter-spacing: -0.01em;
}
.brand__seal {
  width: 44px; height: 44px;
  display: grid;
  place-items: center;
  position: relative;
  background: transparent;
}
.brand__seal--logo svg { display: block; }
.brand__txt { line-height: 1; }
.brand__sub {
  display: block;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 4px;
  font-weight: 500;
}
.nav__links {
  display: flex;
  gap: 4px;
  align-items: center;
}
.nav__links a {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 10px 14px;
  color: var(--ink-soft);
  transition: color .2s;
  position: relative;
}
.nav__links a:hover { color: var(--ink); }
.nav__links a::before {
  content: "";
  position: absolute;
  left: 14px;
  bottom: 6px;
  width: 0;
  height: 1px;
  background: var(--red);
  transition: width .25s ease;
}
.nav__links a:hover::before { width: calc(100% - 28px); }
.nav__cta {
  margin-left: 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: background .2s;
}
.nav__cta:hover { background: var(--red); }

/* hamburger toggle (hidden on desktop) */
.nav__toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 42px; height: 42px;
  padding: 0 9px;
  background: transparent;
  border: 1px solid var(--line-mid);
  border-radius: 8px;
}
.nav__toggle span {
  display: block;
  height: 2px;
  width: 100%;
  background: var(--ink);
  transition: transform .25s ease, opacity .2s ease;
}
.nav.is-open .nav__toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav.is-open .nav__toggle span:nth-child(2) { opacity: 0; }
.nav.is-open .nav__toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* mobile drawer */
.nav__drawer {
  display: none;
  flex-direction: column;
  gap: 2px;
  padding: 8px var(--gutter) 20px;
  border-top: var(--rule);
  background: rgba(238, 244, 237, 0.97);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
}
.nav__drawer a {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding: 14px 4px;
  border-bottom: var(--rule);
}
.nav__drawer a:last-child { border-bottom: none; }
.nav__drawer-cta {
  margin-top: 12px;
  background: var(--ink) !important;
  color: var(--paper) !important;
  text-align: center;
  border-radius: 6px;
  border-bottom: none !important;
}

@media (max-width: 820px) {
  .nav__links { display: none; }
  .nav__toggle { display: flex; }
  .nav.is-open .nav__drawer { display: flex; }
}

/* =========================================================
   Hero
   ========================================================= */
.hero {
  position: relative;
  padding: 56px 0 0;
  overflow: hidden;
}
.hero__meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 32px;
  border-bottom: var(--rule);
  flex-wrap: wrap;
  gap: 12px;
}
.hero__meta-item { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
.hero__meta-item strong { color: var(--ink); font-weight: 500; margin-left: 8px; }

.hero__title {
  padding: clamp(48px, 7vw, 96px) 0 clamp(36px, 4vw, 64px);
  position: relative;
}
.hero__title h1 {
  font-weight: 400;
  max-width: 14ch;
}
.hero__title h1 .accent { font-style: italic; color: var(--ink-3); font-weight: 400; }
.hero__title h1 .amp {
  font-style: italic;
  color: var(--red);
  font-weight: 400;
  font-size: 0.85em;
}

.hero__lower {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: clamp(32px, 5vw, 80px);
  align-items: end;
  padding-bottom: clamp(40px, 5vw, 80px);
}
@media (max-width: 900px) {
  .hero__lower { grid-template-columns: 1fr; }
}
.hero__lede {
  font-family: var(--serif);
  font-size: clamp(20px, 1.7vw, 26px);
  line-height: 1.35;
  color: var(--ink);
  max-width: 38ch;
  font-weight: 400;
}
.hero__lede .it { color: var(--ink-3); }
.hero__cta-row {
  display: flex;
  gap: 14px;
  margin-top: 32px;
  flex-wrap: wrap;
}

/* Hero photo + node motif */
.hero__media {
  position: relative;
  aspect-ratio: 4 / 5;
  background: var(--ink);
  overflow: hidden;
}
.hero__media image-slot,
.hero__media .hero__photo {
  --slot-bg: #102a4d;
  --slot-fg: rgba(238,244,237,0.55);
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: saturate(.92) contrast(1.05);
}
.hero__media::after {
  /* film grain / vignette */
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 80% at 50% 100%, rgba(11,37,69,0) 40%, rgba(11,37,69,0.55) 100%),
    radial-gradient(80% 60% at 0% 0%, rgba(141,169,196,0.18), transparent 60%);
  pointer-events: none;
  mix-blend-mode: multiply;
}
.hero__media-tag {
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 3;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper);
  background: rgba(11,37,69,0.6);
  backdrop-filter: blur(6px);
  padding: 8px 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.hero__media-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(214,40,40,0.6); }
  50% { opacity: 0.6; transform: scale(1.1); box-shadow: 0 0 0 8px rgba(214,40,40,0); }
}
.hero__nodes {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.hero__strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line-strong);
  border-bottom: 1px solid var(--line-strong);
}
.hero__strip-item {
  padding: 28px 24px;
  border-right: var(--rule);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hero__strip-item:last-child { border-right: none; }
.hero__strip-item .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
.hero__strip-item .v { font-family: var(--serif); font-size: clamp(24px, 2.6vw, 36px); font-weight: 500; line-height: 1.05; }
.hero__strip-item .v .small { font-size: 0.55em; color: var(--ink-soft); margin-left: 4px; }
@media (max-width: 800px) {
  .hero__strip { grid-template-columns: repeat(2, 1fr); }
  .hero__strip-item:nth-child(2n) { border-right: none; }
  .hero__strip-item:nth-child(-n+2) { border-bottom: var(--rule); }
}

/* =========================================================
   About
   ========================================================= */
.about {
  background: var(--paper-warm);
  border-top: 1px solid var(--line-strong);
  border-bottom: 1px solid var(--line-strong);
}
.about__inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(40px, 6vw, 100px);
  align-items: center;
}
@media (max-width: 900px) { .about__inner { grid-template-columns: 1fr; } }
.about__visual {
  position: relative;
  aspect-ratio: 1 / 1;
  background: var(--ink);
  color: var(--paper);
  display: grid;
  place-items: center;
  overflow: hidden;
}
.about__quote {
  position: relative;
  z-index: 2;
  text-align: center;
  font-family: var(--serif);
  font-size: clamp(22px, 2.2vw, 32px);
  line-height: 1.25;
  max-width: 24ch;
  padding: 32px;
}
.about__quote .mark {
  display: block;
  font-size: 80px;
  line-height: 0.5;
  margin-bottom: 24px;
  color: var(--red);
  font-style: italic;
}
.about__visual-net {
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: 0.5;
}
.about__copy h2 { margin-bottom: 28px; max-width: 12ch; }
.about__copy p { color: var(--ink-soft); font-size: 18px; line-height: 1.55; margin-bottom: 18px; max-width: 50ch; }
.about__copy .lead { font-family: var(--serif); font-size: 22px; color: var(--ink); line-height: 1.4; margin-bottom: 24px; }
.about__copy .btn { margin-top: 16px; }

/* =========================================================
   Why Attend (numbered cards)
   ========================================================= */
.why {
  background: var(--paper);
}
.why__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.why__card {
  padding: 48px 36px 56px;
  border-right: var(--rule);
  border-top: 1px solid var(--line-strong);
  position: relative;
  transition: background .3s ease;
}
.why__card:last-child { border-right: none; }
.why__card:hover { background: var(--paper-warm); }
.why__card .num {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  color: var(--red);
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.why__card .num::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.why__card h3 {
  font-size: 28px;
  margin-bottom: 16px;
  max-width: 16ch;
}
.why__card p { color: var(--ink-soft); font-size: 15.5px; line-height: 1.55; }
@media (max-width: 800px) {
  .why__grid { grid-template-columns: 1fr; }
  .why__card { border-right: none; }
}

/* =========================================================
   Audiences
   ========================================================= */
.aud {
  border-top: 1px solid var(--line-strong);
  background: var(--ink);
  color: var(--paper);
}
.aud .eyebrow { color: rgba(238,244,237,0.7); }
.aud .eyebrow .dot { background: var(--gold); }
.aud .sec-head { border-bottom-color: rgba(238,244,237,0.15); }
.aud .sec-head__body p { color: rgba(238,244,237,0.7); }
.aud__grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid rgba(238,244,237,0.15);
}
@media (max-width: 1000px) { .aud__grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .aud__grid { grid-template-columns: 1fr; } }
.aud__card {
  padding: 40px 32px 44px;
  border-right: 1px solid rgba(238,244,237,0.15);
  position: relative;
  transition: background .3s ease;
  cursor: default;
}
.aud__card:last-child { border-right: none; }
.aud__card:hover { background: rgba(141,169,196,0.08); }
.aud__card .icon {
  width: 44px; height: 44px;
  border: 1px solid rgba(238,244,237,0.3);
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin-bottom: 28px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--paper);
}
.aud__card h3 { font-size: 26px; margin-bottom: 12px; }
.aud__card p { color: rgba(238,244,237,0.65); font-size: 14.5px; line-height: 1.55; }
.aud__card .track-pill {
  margin-top: 24px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(238,244,237,0.55);
  padding-top: 16px;
  border-top: 1px solid rgba(238,244,237,0.12);
  width: 100%;
  transition: color .2s;
}
.aud__card:hover .track-pill { color: var(--gold); }
@media (max-width: 1000px) {
  .aud__card:nth-child(2n) { border-right: none; }
  .aud__card:nth-child(-n+2) { border-bottom: 1px solid rgba(238,244,237,0.15); }
}
@media (max-width: 560px) {
  .aud__card { border-right: none; border-bottom: 1px solid rgba(238,244,237,0.15); }
  .aud__card:last-child { border-bottom: none; }
}

/* =========================================================
   Agenda
   ========================================================= */
.agenda { background: var(--paper); }
.agenda__filter {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 48px;
  padding-bottom: 32px;
  border-bottom: var(--rule);
  align-items: center;
}
.agenda__filter-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-right: 16px;
}
.chip {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 9px 14px;
  border: 1px solid var(--line-mid);
  background: transparent;
  color: var(--ink-soft);
  border-radius: 999px;
  transition: all .2s ease;
}
.chip:hover { color: var(--ink); border-color: var(--ink); }
.chip.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.agenda__list {
  position: relative;
}
.agenda__item {
  display: grid;
  grid-template-columns: 200px 1fr auto;
  gap: 40px;
  padding: 32px 0;
  border-top: var(--rule);
  position: relative;
  transition: background .3s ease, padding .3s ease;
  align-items: start;
}
.agenda__item:last-of-type { border-bottom: var(--rule); }
.agenda__item:hover { background: var(--paper-warm); padding-left: 16px; padding-right: 16px; }
.agenda__item.is-dimmed { opacity: 0.25; }
.agenda__time {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  line-height: 1.1;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.agenda__time .sub { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); margin-top: 6px; font-weight: 400; }
.agenda__body h3 { font-size: 22px; margin-bottom: 10px; line-height: 1.2; }
.agenda__body p { color: var(--ink-soft); font-size: 15px; max-width: 56ch; }
.agenda__tracks { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.agenda__track-tag {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 5px 10px;
  border: 1px solid var(--line-mid);
  color: var(--ink-soft);
  background: var(--paper-card);
  border-radius: 2px;
}
.agenda__track-tag[data-track="student"]   { border-color: rgba(214,40,40,0.35); color: var(--red); background: rgba(214,40,40,0.05); }
.agenda__track-tag[data-track="veteran"]   { border-color: rgba(11,37,69,0.45); color: var(--ink); background: rgba(11,37,69,0.04); }
.agenda__track-tag[data-track="business"]  { border-color: rgba(74,107,138,0.5); color: var(--slate-deep); background: rgba(141,169,196,0.12); }
.agenda__track-tag[data-track="all"]       { border-color: var(--line-mid); color: var(--ink-soft); }
.agenda__tag {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
  white-space: nowrap;
  padding-top: 6px;
}
.agenda__sessions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 20px;
}
@media (max-width: 800px) { .agenda__sessions { grid-template-columns: 1fr; } }
.agenda__session {
  padding: 18px 18px;
  border-left: 3px solid var(--line-mid);
  background: var(--paper-card);
  transition: border-color .25s ease, transform .25s ease;
}
.agenda__session:hover { transform: translateX(2px); }
.agenda__session[data-track="student"]  { border-left-color: var(--red); }
.agenda__session[data-track="veteran"]  { border-left-color: var(--ink); }
.agenda__session[data-track="business"] { border-left-color: var(--slate-deep); }
.agenda__session .label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
.agenda__session h4 { font-family: var(--serif); font-size: 16px; line-height: 1.25; font-weight: 500; }

@media (max-width: 800px) {
  .agenda__item { grid-template-columns: 1fr; gap: 14px; padding: 24px 0; }
  .agenda__item:hover { padding-left: 0; padding-right: 0; }
  .agenda__tag { padding-top: 0; }
}

/* =========================================================
   Partners
   ========================================================= */
.partners { background: var(--paper-warm); border-top: 1px solid var(--line-strong); }

.partners__host {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 60px;
  padding: 48px;
  background: var(--paper-card);
  border: 1px solid var(--line-mid);
  position: relative;
  margin-bottom: 64px;
}
@media (max-width: 800px) { .partners__host { grid-template-columns: 1fr; padding: 32px; gap: 24px; } }
.partners__host::before {
  content: "ANCHOR · HOST";
  position: absolute;
  top: -10px;
  left: 32px;
  background: var(--paper-warm);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.2em;
  color: var(--red);
  padding: 0 12px;
  font-weight: 500;
}
.partners__host-logo {
  aspect-ratio: 4/3;
  background: var(--ink);
  display: grid;
  place-items: center;
  color: var(--paper);
  font-family: var(--serif);
  font-size: 36px;
  font-weight: 500;
  letter-spacing: -0.01em;
  position: relative;
  overflow: hidden;
}
.partners__host-logo::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(60% 80% at 30% 20%, rgba(141,169,196,0.2), transparent 70%);
}
.partners__host-body h3 { font-size: 36px; margin-bottom: 14px; }
.partners__host-body p { color: var(--ink-soft); font-size: 16px; line-height: 1.6; max-width: 50ch; }

.partners__cats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border-top: var(--rule);
}
@media (max-width: 900px) { .partners__cats { grid-template-columns: 1fr; } }
.partners__cat {
  padding: 32px 28px 32px 0;
  border-right: var(--rule);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.partners__cat:last-child { border-right: none; }
@media (max-width: 900px) {
  .partners__cat { border-right: none; border-bottom: var(--rule); padding: 24px 0; }
  .partners__cat:last-child { border-bottom: none; }
}
.partners__cat .eyebrow { color: var(--red); }
.partners__cat .eyebrow .dot { background: var(--red); }
.partners__cat h3 { font-size: 22px; }
.partners__cat .logos {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.partners__logo {
  height: 56px;
  min-width: 110px;
  flex: 1 1 110px;
  background: var(--paper-card);
  border: 1px dashed var(--line-mid);
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  padding: 8px;
  text-align: center;
  transition: all .2s;
}
.partners__logo:hover { color: var(--ink); border-style: solid; border-color: var(--ink); }

/* =========================================================
   Register
   ========================================================= */
.register {
  background: var(--ink);
  color: var(--paper);
  position: relative;
  overflow: hidden;
}
.register .eyebrow { color: rgba(238,244,237,0.7); }
.register .eyebrow .dot { background: var(--red); }
.register .sec-head { border-bottom-color: rgba(238,244,237,0.15); }
.register .sec-head__body p { color: rgba(238,244,237,0.75); }
.register__net {
  position: absolute;
  inset: 0;
  opacity: 0.35;
  pointer-events: none;
}
.register__inner {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 48px;
  position: relative;
  z-index: 2;
}
@media (max-width: 900px) { .register__inner { grid-template-columns: 1fr; } }
.register__side h3 { font-size: 28px; margin-bottom: 16px; }
.register__side p { color: rgba(238,244,237,0.75); font-size: 15.5px; line-height: 1.6; margin-bottom: 16px; max-width: 38ch; }
.register__bullets {
  list-style: none;
  padding: 0; margin: 24px 0 0;
  display: flex; flex-direction: column;
  gap: 14px;
}
.register__bullets li {
  display: flex; gap: 14px;
  font-size: 14.5px;
  align-items: flex-start;
  color: rgba(238,244,237,0.9);
}
.register__bullets li::before {
  content: "+";
  color: var(--red);
  font-family: var(--mono);
  font-weight: 600;
  flex: 0 0 16px;
}
.register__form-shell {
  background: var(--paper);
  color: var(--ink);
  border: 1px solid rgba(238,244,237,0.15);
  position: relative;
}
.register__form-head {
  padding: 20px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: var(--rule);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.register__form-head .status { color: var(--red); display: inline-flex; align-items: center; gap: 8px; }
.register__form-head .status .dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
.register__form-head a { color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; font-size: 10.5px; }
.register__form-head a:hover { color: var(--ink); }
.register__form iframe {
  display: block;
  width: 100%;
  height: 820px;
  border: 0;
  background: var(--paper);
}

/* =========================================================
   FAQ
   ========================================================= */
.faq { background: var(--paper); border-top: 1px solid var(--line-strong); }
.faq__inner {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 80px;
}
@media (max-width: 900px) { .faq__inner { grid-template-columns: 1fr; gap: 40px; } }
.faq__intro h2 { margin-bottom: 16px; }
.faq__intro p { color: var(--ink-soft); font-size: 16px; }
.faq__list { border-top: 1px solid var(--line-strong); }
.faq__item {
  border-bottom: var(--rule);
  transition: background .25s ease;
}
.faq__item:last-child { border-bottom: 1px solid var(--line-strong); }
.faq__q {
  width: 100%;
  background: none;
  border: 0;
  text-align: left;
  padding: 24px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
}
.faq__q:hover { color: var(--red); }
.faq__icon {
  flex: 0 0 28px;
  width: 28px; height: 28px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-mid);
  border-radius: 50%;
  font-family: var(--mono);
  font-size: 16px;
  color: var(--ink);
  transition: transform .3s ease, background .25s, color .25s, border-color .25s;
  font-weight: 400;
  line-height: 1;
}
.faq__item.is-open .faq__icon { transform: rotate(45deg); background: var(--ink); color: var(--paper); border-color: var(--ink); }
.faq__a {
  overflow: hidden;
  max-height: 0;
  transition: max-height .4s ease, padding .3s ease;
}
.faq__item.is-open .faq__a { max-height: 400px; padding: 0 0 28px; }
.faq__a p { color: var(--ink-soft); font-size: 16px; line-height: 1.65; max-width: 60ch; }
.faq__a a { color: var(--red); text-decoration: underline; text-underline-offset: 3px; }

/* =========================================================
   Closing CTA
   ========================================================= */
.cta {
  background: var(--paper-warm);
  border-top: 1px solid var(--line-strong);
  border-bottom: 1px solid var(--line-strong);
  text-align: center;
  padding: clamp(80px, 10vw, 160px) 0;
  position: relative;
  overflow: hidden;
}
.cta__net { position: absolute; inset: 0; opacity: 0.35; pointer-events: none; }
.cta__inner { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; padding: 0 var(--gutter); }
.cta h2 { font-size: clamp(40px, 5.5vw, 88px); margin-bottom: 28px; font-weight: 400; }
.cta h2 .it { font-style: italic; color: var(--red); }
.cta p { color: var(--ink-soft); font-size: 17px; max-width: 50ch; margin: 0 auto 36px; }
.cta__row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

/* =========================================================
   Footer
   ========================================================= */
.footer {
  background: var(--ink);
  color: var(--paper);
  padding: 80px 0 32px;
  font-size: 14px;
}
.footer__top {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 40px;
  padding-bottom: 56px;
  border-bottom: 1px solid rgba(238,244,237,0.15);
}
@media (max-width: 800px) { .footer__top { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .footer__top { grid-template-columns: 1fr; } }
.footer__logo-card {
  display: inline-flex;
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 22px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
.footer__logo-card svg,
.footer__logo-card img { display: block; }
.brand__seal--logo img { object-fit: contain; }
.footer__brand h3 { font-family: var(--serif); font-size: 22px; margin-bottom: 12px; max-width: 18ch; }
.footer__brand p { color: rgba(238,244,237,0.65); max-width: 36ch; }
.footer__col h4 {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(238,244,237,0.5);
  margin-bottom: 16px;
  font-weight: 500;
}
.footer__col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.footer__col a { color: rgba(238,244,237,0.85); transition: color .2s; }
.footer__col a:hover { color: var(--red); }
.footer__bottom {
  display: flex; justify-content: space-between;
  padding-top: 28px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(238,244,237,0.55);
  flex-wrap: wrap;
  gap: 12px;
}
.footer__values {
  padding: 24px 0;
  border-top: 1px solid rgba(238,244,237,0.1);
  margin-top: 24px;
  display: flex;
  justify-content: center;
  gap: clamp(20px, 4vw, 60px);
  flex-wrap: wrap;
  font-family: var(--serif);
  font-style: italic;
  font-size: 17px;
  color: rgba(238,244,237,0.7);
}
.footer__values span { display: inline-flex; align-items: center; gap: 14px; }
.footer__values span::after {
  content: "✦";
  color: var(--red);
  font-style: normal;
}
.footer__values span:last-child::after { display: none; }

  </style>

  <script>
/**
 * <image-slot> — user-fillable image placeholder.
 *
 * Drop this into a deck, mockup, or page wherever you want the user to
 * supply an image. You control the slot's shape and size; the user fills it
 * by dragging an image file onto it (or clicking to browse). The dropped
 * image persists across reloads via a .image-slots.state.json sidecar —
 * same read-via-fetch / write-via-window.omelette pattern as
 * design_canvas.jsx, so the filled slot shows on share links, downloaded
 * zips, and PPTX export. Outside the omelette runtime the slot is read-only.
 *
 * The host bridge only allows sidecar writes at the project root, so the
 * HTML that uses this component is assumed to live at the project root too
 * (same constraint as design_canvas.jsx).
 *
 * Attributes:
 *   id           Persistence key. REQUIRED for the drop to survive reload —
 *                every slot on the page needs a distinct id.
 *   shape        'rect' | 'rounded' | 'circle' | 'pill'   (default 'rounded')
 *                'circle' applies 50% border-radius; on a non-square slot
 *                that's an ellipse — set equal width and height for a true
 *                circle.
 *   radius       Corner radius in px for 'rounded'.       (default 12)
 *   mask         Any CSS clip-path value. Overrides `shape` — use this for
 *                hexagons, blobs, arbitrary polygons.
 *   fit          object-fit: cover | contain | fill.       (default 'cover')
 *                With cover (the default) double-clicking the filled slot
 *                enters a reframe mode: the whole image spills past the mask
 *                (translucent outside, opaque inside), drag to reposition,
 *                corner-drag to scale. The crop persists alongside the image
 *                in the sidecar. contain/fill stay static.
 *   position     object-position for fit=contain|fill.     (default '50% 50%')
 *   placeholder  Empty-state caption.                      (default 'Drop an image')
 *   src          Optional initial/fallback image URL. A user drop overrides
 *                it; clearing the drop reveals src again.
 *
 * Size and layout come from ordinary CSS on the element — width/height
 * inline or from a parent grid — so it composes with any layout.
 *
 * Usage:
 *   <script src="image-slot.js"><\/script>
 *   <image-slot id="hero"   style="width:800px;height:450px" shape="rounded" radius="20"
 *               placeholder="Drop a hero image"></image-slot>
 *   <image-slot id="avatar" style="width:120px;height:120px" shape="circle"></image-slot>
 *   <image-slot id="kite"   style="width:300px;height:300px"
 *               mask="polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></image-slot>
 */

(() => {
  const STATE_FILE = '.image-slots.state.json';
  // 2× a ~600px slot in a 1920-wide deck — retina-sharp without making the
  // sidecar enormous. A 1200px WebP at q=0.85 is ~150-300KB.
  const MAX_DIM = 1200;
  // Raster formats only. SVG is excluded (can carry script; createImageBitmap
  // on SVG blobs is inconsistent). GIF is excluded because the canvas
  // re-encode keeps only the first frame, so an animated GIF would silently
  // go still — better to reject than surprise.
  const ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/avif'];

  // ── Shared sidecar store ────────────────────────────────────────────────
  // One fetch + immediate write-on-change for every <image-slot> on the
  // page. Reads via fetch() so viewing works anywhere the HTML and sidecar
  // are served together; writes go through window.omelette.writeFile, which
  // the host allowlists to *.state.json basenames only.
  const subs = new Set();
  let slots = {};
  // ids explicitly cleared before the sidecar fetch resolved — otherwise
  // the merge below can't tell "never set" from "just deleted" and would
  // resurrect the sidecar's stale value.
  const tombstones = new Set();
  let loaded = false;
  let loadP = null;

  function load() {
    if (loadP) return loadP;
    loadP = fetch(STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        // Merge: sidecar loses to any in-memory change that raced ahead of
        // the fetch (drop or clear) so neither is clobbered by hydration.
        if (j && typeof j === 'object') {
          const merged = Object.assign({}, j, slots);
          // A framing-only write that raced ahead of hydration must not
          // drop a user image that's only on disk — inherit u from the
          // sidecar for any in-memory entry that lacks one.
          for (const k in slots) {
            if (merged[k] && !merged[k].u && j[k]) {
              merged[k].u = typeof j[k] === 'string' ? j[k] : j[k].u;
            }
          }
          for (const id of tombstones) delete merged[id];
          slots = merged;
        }
        tombstones.clear();
      })
      .catch(() => {})
      .then(() => { loaded = true; subs.forEach((fn) => fn()); });
    return loadP;
  }

  // Serialize writes so two near-simultaneous drops on different slots
  // can't reorder at the backend and leave the sidecar with only the
  // first. A save requested mid-flight just marks dirty and re-fires on
  // completion with the then-current slots.
  let saving = false;
  let saveDirty = false;
  function save() {
    if (saving) { saveDirty = true; return; }
    const w = window.omelette && window.omelette.writeFile;
    if (!w) return;
    saving = true;
    Promise.resolve(w(STATE_FILE, JSON.stringify(slots)))
      .catch(() => {})
      .then(() => { saving = false; if (saveDirty) { saveDirty = false; save(); } });
  }

  const S_MAX = 5;
  const clampS = (s) => Math.max(1, Math.min(S_MAX, s));

  // Normalize a stored slot value. Pre-reframe sidecars stored a bare
  // data-URL string; newer ones store {u, s, x, y}. Either shape is valid.
  function getSlot(id) {
    const v = slots[id];
    if (!v) return null;
    return typeof v === 'string' ? { u: v, s: 1, x: 0, y: 0 } : v;
  }

  function setSlot(id, val) {
    if (!id) return;
    if (val) { slots[id] = val; tombstones.delete(id); }
    else { delete slots[id]; if (!loaded) tombstones.add(id); }
    subs.forEach((fn) => fn());
    // A drop is rare + high-value — write immediately so nav-away can't lose
    // it. Gate on the initial read so we don't overwrite a sidecar we haven't
    // merged yet; the merge in load() keeps this change once the read lands.
    if (loaded) save(); else load().then(save);
  }

  // ── Image downscale ─────────────────────────────────────────────────────
  // Encode through a canvas so the sidecar carries resized bytes, not the
  // raw upload. Longest side is capped at 2× the slot's rendered width
  // (retina) and at MAX_DIM. WebP keeps alpha and is ~10× smaller than PNG
  // for photos, so there's no need for per-image format picking.
  async function toDataUrl(file, targetW) {
    const bitmap = await createImageBitmap(file);
    try {
      const cap = Math.min(MAX_DIM, Math.max(1, Math.round(targetW * 2)) || MAX_DIM);
      const scale = Math.min(1, cap / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return canvas.toDataURL('image/webp', 0.85);
    } finally {
      bitmap.close && bitmap.close();
    }
  }

  // ── Custom element ──────────────────────────────────────────────────────
  const stylesheet =
    ':host{display:inline-block;position:relative;vertical-align:top;' +
    '  font:13px/1.3 system-ui,-apple-system,sans-serif;color:rgba(0,0,0,.55);width:240px;height:160px}' +
    '.frame{position:absolute;inset:0;overflow:hidden;background:rgba(0,0,0,.04)}' +
    // .frame img (clipped) and .spill (unclipped ghost + handles) share the
    // same left/top/width/height in frame-%, computed by _applyView(), so the
    // inside-mask crop and the outside-mask spill stay pixel-aligned.
    '.frame img{position:absolute;max-width:none;transform:translate(-50%,-50%);' +
    '  -webkit-user-drag:none;user-select:none;touch-action:none}' +
    // Reframe mode (double-click): the full image spills past the mask. The
    // spill layer is sized to the IMAGE bounds so its corners are where the
    // resize handles belong. The ghost <img> inside is translucent; the real
    // clipped <img> underneath shows the opaque in-mask crop.
    '.spill{position:absolute;transform:translate(-50%,-50%);display:none;z-index:1;' +
    '  cursor:grab;touch-action:none}' +
    ':host([data-panning]) .spill{cursor:grabbing}' +
    '.spill .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:.35;' +
    '  pointer-events:none;-webkit-user-drag:none;user-select:none;' +
    '  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.2)}' +
